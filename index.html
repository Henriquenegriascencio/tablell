      function formatCurrency(val) {
        const num = Number(val) || 0;
        return num.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
      }

      function formatDate(isoStr) {
        if (!isoStr) return '';
        try {
          const d = new Date(isoStr);
          return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
        } catch {
          return isoStr;
        }
      }

      function formatPaymentLabel(method) {
        switch (method) {
          case 'pix': return 'PIX';
          case 'dinheiro': return 'Dinheiro';
          case 'cartao': return 'Cartão';
          default: return method ? String(method).toUpperCase() : 'Não especificado';
        }

        url: 'https://srfnlbapjlbijeqmndgq.supabase.co',

        COMANDAS: 'tablell_comandas',
        EXPENSES: 'tablell_expenses',

        CONFIG: 'tablell_supabase_config',

        { id: 'prod-2', nome: 'Espetinho', preco_custo: 4.00, preco_venda: 10.00, categoria: 'Espetos' },
        { id: 'prod-3', nome: 'Refrigerante', preco_custo: 2.00, preco_venda: 5.00, categoria: 'Bebidas' },
        { id: 'prod-4', nome: 'Água Mineral', preco_custo: 1.20, preco_venda: 4.00, categoria: 'Bebidas' },
        { id: 'prod-5', nome: 'Pastel Frito', preco_custo: 3.50, preco_venda: 9.00, categoria: 'Salgados' },

        { id: 'cust-1', nome: 'João', avatar: '😎', telefone: '11987654321' },
        { id: 'cust-2', nome: 'Maria', avatar: '🐮', telefone: '11991234567' },
        { id: 'cust-3', nome: 'Lucas', avatar: '🍻', telefone: '11976543210' },
        { id: 'cust-4', nome: 'Bruno Silva', avatar: '⚽', telefone: '11988887777' },
      ];

      const todayStr = new Date().toISOString().split('T')[0];

      const INITIAL_EXPENSES = [
        { id: 'exp-1', descricao: 'Fardo Cerveja 12un / Carvão', valor: 75.00, data: todayStr, categoria: 'Bebidas/Insumos' },
        { id: 'exp-2', descricao: 'Carnes e temperos para espetinhos', valor: 80.00, data: todayStr, categoria: 'Carnes/Carvão' },

      const INITIAL_COMANDAS = [
        {
          id: 'cmd-1',
          cliente_id: 'cust-1',
          cliente_nome: 'João',
          data_evento: todayStr,
          produto_id: 'prod-1',

          preco_unitario: 10.00,

      const INITIAL_PAYMENTS = [
        {
          id: 'pay-1',
          cliente_id: 'cust-2',
          cliente_nome: 'Maria',
          data_hora: new Date().toISOString(),
          valor: 10.00,
          forma_pagamento: 'pix',
          data_evento: todayStr,
          observacoes: 'Acerto imediato via Pix',
        },
      ];

      // --- LOCAL STORAGE SERVICE ---
      const storageService = {
        setProducts(products) {
          const sanitized = products.map(p => ({
            ...p,
            categoria: p.categoria || 'Geral',
            preco_custo: Number(p.preco_custo) || 0,
            preco_venda: Number(p.preco_venda) || 0,
          }));
          localStorage.setItem(STORAGE_KEYS.PRODUCTS, JSON.stringify(sanitized));
        },
        getProducts() {
          const data = localStorage.getItem(STORAGE_KEYS.PRODUCTS);
          if (data === null) {
            localStorage.setItem(STORAGE_KEYS.PRODUCTS, JSON.stringify(INITIAL_PRODUCTS));
            return INITIAL_PRODUCTS;
          }
          try {
            const parsed = JSON.parse(data);
            return parsed.map(p => ({
              ...p,
              categoria: p.categoria || 'Geral',
              preco_custo: Number(p.preco_custo) || 0,
              preco_venda: Number(p.preco_venda) || 0,
            }));
          } catch {
            return [];
          }
        },
        saveProduct(product) {
          const sanitized = {
            ...product,
            categoria: product.categoria?.trim() || 'Geral',
          };
          const list = this.getProducts();
          const idx = list.findIndex(p => p.id === sanitized.id);
          if (idx >= 0) list[idx] = sanitized;
          else list.push(sanitized);
          this.setProducts(list);
          return list;
        },
        deleteProduct(id) {
          const list = this.getProducts().filter(p => p.id !== id);
          this.setProducts(list);
          return list;
        },

        setCustomers(customers) {
          const sanitized = customers.map(c => ({
            ...c,
            avatar: c.avatar || '😎',
          }));
          localStorage.setItem(STORAGE_KEYS.CUSTOMERS, JSON.stringify(sanitized));
        },
        getCustomers() {
          const data = localStorage.getItem(STORAGE_KEYS.CUSTOMERS);
          if (data === null) {
            localStorage.setItem(STORAGE_KEYS.CUSTOMERS, JSON.stringify(INITIAL_CUSTOMERS));
            return INITIAL_CUSTOMERS;
          }
          try {
            const parsed = JSON.parse(data);
            return parsed.map(c => ({
              ...c,
              avatar: c.avatar || '😎',
            }));
          } catch {
            return [];
          }
        },
        saveCustomer(customer) {
          const list = this.getCustomers();
          const idx = list.findIndex(c => c.id === customer.id);
          if (idx >= 0) list[idx] = customer;
          else list.push(customer);
          this.setCustomers(list);
          return list;
        },
        deleteCustomer(id) {
          const list = this.getCustomers().filter(c => c.id !== id);
          this.setCustomers(list);
          return list;
        },

        setComandaItems(items) {
          localStorage.setItem(STORAGE_KEYS.COMANDAS, JSON.stringify(items));
        },
        getComandaItems() {
          const data = localStorage.getItem(STORAGE_KEYS.COMANDAS);
          if (data === null) {
            localStorage.setItem(STORAGE_KEYS.COMANDAS, JSON.stringify(INITIAL_COMANDAS));
            return INITIAL_COMANDAS;
          }
          try {
            return JSON.parse(data);
          } catch {
            return [];
          }
        },
        addComandaItems(items) {
          const list = this.getComandaItems();
          list.push(...items);
          this.setComandaItems(list);
          return list;
        },
        settleComandaItems(clienteId, dataEvento, formaPagamento = 'pix') {
          const list = this.getComandaItems();
          let settledAmount = 0;
          list.forEach(item => {
            if (item.cliente_id === clienteId && item.status === 'pendente') {
              if (!dataEvento || item.data_evento === dataEvento) {
                item.status = 'pago';
                item.forma_pagamento = formaPagamento;
                settledAmount += item.subtotal;
              }
            }
          });
          this.setComandaItems(list);

          if (settledAmount > 0) {
            const customer = this.getCustomers().find(c => c.id === clienteId);
            this.addPayment({
              id: 'pay-' + Date.now(),
              cliente_id: clienteId,
              cliente_nome: customer ? customer.nome : 'Amigo',
              data_hora: new Date().toISOString(),
              valor: settledAmount,
              forma_pagamento: formaPagamento,
              data_evento: dataEvento,
              observacoes: dataEvento ? 'Acerto de fiado do evento ' + dataEvento : 'Acerto total de fiados acumulados',
            });
          }
          return { updated: list, settledAmount };
        },

        setExpenses(expenses) {
          const sanitized = expenses.map(e => ({
            ...e,
            categoria: e.categoria || 'Insumos',
          }));
          localStorage.setItem(STORAGE_KEYS.EXPENSES, JSON.stringify(sanitized));
        },
        getExpenses() {
          const data = localStorage.getItem(STORAGE_KEYS.EXPENSES);
          if (data === null) {
            localStorage.setItem(STORAGE_KEYS.EXPENSES, JSON.stringify(INITIAL_EXPENSES));
            return INITIAL_EXPENSES;
          }
          try {
            const parsed = JSON.parse(data);
            return parsed.map(e => ({
              ...e,
              categoria: e.categoria || 'Insumos',
              valor: Number(e.valor) || 0,
            }));
          } catch {
            return [];
          }
        },
        addExpense(expense) {
          const sanitized = {
            ...expense,
            categoria: expense.categoria?.trim() || 'Insumos',
          };
          const list = this.getExpenses();
          list.unshift(sanitized);
          this.setExpenses(list);
          return list;
        },
        deleteExpense(id) {
          const list = this.getExpenses().filter(e => e.id !== id);
          this.setExpenses(list);
          return list;
        },

        setPayments(payments) {
          localStorage.setItem(STORAGE_KEYS.PAYMENTS, JSON.stringify(payments));
        },
        getPayments() {
          const data = localStorage.getItem(STORAGE_KEYS.PAYMENTS);
          if (data === null) {
            localStorage.setItem(STORAGE_KEYS.PAYMENTS, JSON.stringify(INITIAL_PAYMENTS));
            return INITIAL_PAYMENTS;
          }
          try {
            const parsed = JSON.parse(data);
            return parsed.map(p => ({
              ...p,
              valor: Number(p.valor) || 0,
              forma_pagamento: p.forma_pagamento || 'pix',
            }));
          } catch {
            return [];
          }
        },
        addPayment(payment) {
          const list = this.getPayments();
          list.unshift(payment);
          this.setPayments(list);
          return list;
        },
        deletePayment(id) {
          const list = this.getPayments().filter(p => p.id !== id);
          this.setPayments(list);
          return list;
        },

        getConfig() {
          const data = localStorage.getItem(STORAGE_KEYS.CONFIG);
          if (!data) {
            localStorage.setItem(STORAGE_KEYS.CONFIG, JSON.stringify(DEFAULT_SUPABASE_CONFIG));
            return DEFAULT_SUPABASE_CONFIG;
          }
          try {
            const parsed = JSON.parse(data);
            if (!parsed.url || !parsed.anon_key) return DEFAULT_SUPABASE_CONFIG;
            return parsed;
          } catch {
            return DEFAULT_SUPABASE_CONFIG;
          }
        },
        saveConfig(config) {
          localStorage.setItem(STORAGE_KEYS.CONFIG, JSON.stringify(config));
        },
        resetAllToDemo() {
          localStorage.setItem(STORAGE_KEYS.PRODUCTS, JSON.stringify(INITIAL_PRODUCTS));

          localStorage.setItem(STORAGE_KEYS.EXPENSES, JSON.stringify(INITIAL_EXPENSES));
          localStorage.setItem(STORAGE_KEYS.PAYMENTS, JSON.stringify(INITIAL_PAYMENTS));
          localStorage.setItem(STORAGE_KEYS.CONFIG, JSON.stringify(DEFAULT_SUPABASE_CONFIG));

      // --- SUPABASE CLIENT SERVICE ---
      let clientInstance = null;
      let currentUrl = '';
      let currentKey = '';
      let activeChannel = null;

      function getClient(url, key) {
        const config = storageService.getConfig();
        const targetUrl = url || config.url || DEFAULT_SUPABASE_CONFIG.url;
        const targetKey = key || config.anon_key || DEFAULT_SUPABASE_CONFIG.anon_key;

        if (!targetUrl || !targetKey || !window.supabase) return null;

        if (!clientInstance || currentUrl !== targetUrl || currentKey !== targetKey) {
          try {
            clientInstance = window.supabase.createClient(targetUrl, targetKey);
            currentUrl = targetUrl;
            currentKey = targetKey;
          } catch (err) {
            console.error('Falha ao inicializar cliente Supabase:', err);
            return null;
          }
        }
        return clientInstance;
      }

      async function testConnection(url, key) {
        const targetUrl = url || DEFAULT_SUPABASE_CONFIG.url;
        const targetKey = key || DEFAULT_SUPABASE_CONFIG.anon_key;
        if (!targetUrl || !targetKey || !window.supabase) {
          return { success: false, message: 'URL e Chave Anon são obrigatórias.' };
        }
        const startTime = performance.now();
        try {
          const tempClient = window.supabase.createClient(targetUrl, targetKey);
          const tables = ['products', 'customers', 'comanda_items', 'expenses', 'payments'];
          const missingTables = [];
          const results = await Promise.all(tables.map(tbl => tempClient.from(tbl).select('id').limit(1)));
          const latencyMs = Math.round(performance.now() - startTime);

          results.forEach((res, index) => {
            if (res.error) {
              const msg = res.error.message || '';
              if (res.error.code === 'PGRST204' || res.error.code === '42P01' || msg.includes('does not exist') || msg.includes('schema cache')) {
                missingTables.push(tables[index]);
              }
            }
          });

          if (missingTables.length > 0) {
            return {
              success: true,
              latencyMs,
              message: 'Conectado ao projeto (' + latencyMs + 'ms)! Nota: As seguintes tabelas não existem: ' + missingTables.join(', ') + '. Execute o script SQL no Supabase.',
            };
          }
          return {
            success: true,
            latencyMs,
            message: 'Conexão 100% estabelecida e ativa com todas as 5 tabelas respondendo em ' + latencyMs + 'ms!',
          };
        } catch (err) {
          return { success: false, message: 'Falha na conexão: ' + (err.message || String(err)) };
        }
      }

      async function pullAllFromSupabase() {
        const client = getClient();
        if (!client) return { success: false, error: 'Supabase não conectado.' };

        try {
          const [prodRes, custRes, cmdRes, expRes, payRes] = await Promise.all([
            client.from('products').select('*'),
            client.from('customers').select('*'),
            client.from('comanda_items').select('*'),
            client.from('expenses').select('*'),
            client.from('payments').select('*'),
          ]);

          let updatedCount = 0;
          if (!prodRes.error && Array.isArray(prodRes.data)) {
            storageService.setProducts(prodRes.data);
            updatedCount++;
          }
          if (!custRes.error && Array.isArray(custRes.data)) {
            storageService.setCustomers(custRes.data);
            updatedCount++;
          }
          if (!cmdRes.error && Array.isArray(cmdRes.data)) {
            storageService.setComandaItems(cmdRes.data);
            updatedCount++;
          }
          if (!expRes.error && Array.isArray(expRes.data)) {
            storageService.setExpenses(expRes.data);
            updatedCount++;
          }
          if (!payRes.error && Array.isArray(payRes.data)) {

      async function deleteFromSupabase(table, id) {
        const client = getClient();
        if (!client) return { success: false, error: 'Supabase não inicializado.' };
        try {
          const { error } = await client.from(table).delete().eq('id', id);
          if (error) return { success: false, error: error.message };
          return { success: true };
        } catch (err) {
          return { success: false, error: err.message || String(err) };
        }
      }

      async function upsertToSupabase(table, recordOrRecords) {
        const client = getClient();
        if (!client) return { success: false, error: 'Supabase não inicializado.' };

        try {
          const rawList = Array.isArray(recordOrRecords) ? recordOrRecords : [recordOrRecords];
          if (rawList.length === 0) return { success: true };

          let recordsPayload = rawList;

          if (table === 'products') {
            recordsPayload = rawList.map(r => ({
              id: String(r.id),
              nome: String(r.nome || 'Produto'),
              preco_custo: Number(r.preco_custo) || 0,
              preco_venda: Number(r.preco_venda) || 0,
              categoria: String(r.categoria || 'Geral'),
            }));
          } else if (table === 'customers') {
            recordsPayload = rawList.map(r => ({
              id: String(r.id),
              nome: String(r.nome || 'Amigo'),
              avatar: String(r.avatar || '😎'),
              telefone: r.telefone ? String(r.telefone) : null,
              data_cadastro: r.data_cadastro || new Date().toISOString(),
            }));
          } else if (table === 'comanda_items') {
            recordsPayload = rawList.map(r => ({
              id: String(r.id),
              cliente_id: String(r.cliente_id),
              cliente_nome: String(r.cliente_nome || 'Amigo'),
              data_evento: String(r.data_evento || new Date().toISOString().split('T')[0]),
              produto_id: String(r.produto_id),
              produto_nome: String(r.produto_nome || 'Item'),
              quantidade: Number(r.quantidade) || 1,
              preco_unitario: Number(r.preco_unitario) || 0,
              preco_custo: Number(r.preco_custo) || 0,
              subtotal: Number(r.subtotal) || 0,
              status: String(r.status || 'pendente'),
              forma_pagamento: r.forma_pagamento ? String(r.forma_pagamento) : null,
              created_at: r.created_at || new Date().toISOString(),
            }));
          } else if (table === 'expenses') {
            recordsPayload = rawList.map(r => ({
              id: String(r.id),
              descricao: String(r.descricao || 'Gasto'),
              valor: Number(r.valor) || 0,
              data: String(r.data || new Date().toISOString().split('T')[0]),
              categoria: String(r.categoria || 'Insumos'),
              created_at: r.created_at || new Date().toISOString(),
            }));
          } else if (table === 'payments') {
            recordsPayload = rawList.map(r => ({
              id: String(r.id),
              cliente_id: String(r.cliente_id),
              cliente_nome: String(r.cliente_nome || 'Amigo'),
              data_hora: String(r.data_hora || new Date().toISOString()),
              valor: Number(r.valor) || 0,
              forma_pagamento: String(r.forma_pagamento || 'pix'),
              data_evento: r.data_evento ? String(r.data_evento) : null,
              observacoes: r.observacoes ? String(r.observacoes) : null,
            }));
          }

          let res = await client.from(table).upsert(recordsPayload, { onConflict: 'id' });

          // Auto-adaptation if column is missing on remote table
          if (res.error && res.error.message.includes("Could not find the '")) {
            const match = res.error.message.match(/Could not find the '([^']+)' column/i);
            if (match && match[1]) {
              const missingCol = match[1];
              recordsPayload = recordsPayload.map(r => {
                const copy = { ...r };
                delete copy[missingCol];
                return copy;
              });
              res = await client.from(table).upsert(recordsPayload, { onConflict: 'id' });
            }
          }

          if (res.error) {
            return { success: false, error: res.error.message };
          }
          return { success: true };
        } catch (err) {
          return { success: false, error: err.message || String(err) };
        }
      }

      async function pushLocalDataToSupabase() {
        const client = getClient();
        if (!client) return { success: false, message: 'Supabase não conectado.' };

        try {
          const products = storageService.getProducts();
          const customers = storageService.getCustomers();
          const comandas = storageService.getComandaItems();
          const expenses = storageService.getExpenses();
          const payments = storageService.getPayments();

          if (products.length > 0) await upsertToSupabase('products', products);
          if (customers.length > 0) await upsertToSupabase('customers', customers);
          if (comandas.length > 0) await upsertToSupabase('comanda_items', comandas);
          if (expenses.length > 0) await upsertToSupabase('expenses', expenses);
          if (payments.length > 0) await upsertToSupabase('payments', payments);

          const config = storageService.getConfig();
          config.is_connected = true;
          config.last_sync = new Date().toISOString();
          storageService.saveConfig(config);

          return { success: true, message: 'Sincronização com o Supabase efetuada com sucesso!' };
        } catch (err) {
          return { success: false, message: err.message || String(err) };
        }
      }

      function subscribeToRealtime(onChange) {
        const client = getClient();
        if (!client) return () => {};

        if (activeChannel) {
          client.removeChannel(activeChannel);
        }

        const channel = client
          .channel('tablell-realtime-all')
          .on('postgres_changes', { event: '*', schema: 'public' }, (payload) => {
            pullAllFromSupabase().then(() => {
              onChange();
            });
          })
          .subscribe();

        activeChannel = channel;
        return () => {
          if (activeChannel) {
            client.removeChannel(activeChannel);
            activeChannel = null;
          }
        };
      }

        const [successFeedback, setSuccessFeedback] = useState(null);
        const [settleModal, setSettleModal] = useState(null);

        const selectedCustomer = useMemo(() => customers.find(c => c.id === selectedCustomerId) || null, [customers, selectedCustomerId]);

        const customerDebts = useMemo(() => {
          const map = {};
          comandaItems.forEach(item => {
            if (item.status === 'pendente') {
              map[item.cliente_id] = (map[item.cliente_id] || 0) + item.subtotal;
            }
          });
          return map;
        }, [comandaItems]);

        const pendingByDate = useMemo(() => {
          if (!selectedCustomerId) return [];
          const map = {};
          comandaItems.forEach(item => {
            if (item.cliente_id === selectedCustomerId && item.status === 'pendente') {
              if (!map[item.data_evento]) {
                map[item.data_evento] = { data: item.data_evento, total: 0, items: [] };
              }
              map[item.data_evento].total += item.subtotal;
              map[item.data_evento].items.push(item);
            }
          });
          return Object.values(map).sort((a, b) => b.data.localeCompare(a.data));
        }, [comandaItems, selectedCustomerId]);

        const accumulatedDebt = selectedCustomerId ? (customerDebts[selectedCustomerId] || 0) : 0;
        const currentEventTotal = useMemo(() => draftItems.reduce((acc, i) => acc + i.subtotal, 0), [draftItems]);

        const handleAddProductToDraft = (product) => {
          if (!selectedCustomer) return;
          setDraftItems(prev => {
            const idx = prev.findIndex(i => i.produto_id === product.id);
            if (idx >= 0) {
              return prev.map((item, i) => i === idx ? { ...item, quantidade: item.quantidade + 1, subtotal: (item.quantidade + 1) * item.preco_unitario } : item);
            }
            return [...prev, {
              produto_id: product.id,
              produto_nome: product.nome,
              preco_unitario: product.preco_venda,
              preco_custo: product.preco_custo,
              quantidade: 1,
              subtotal: product.preco_venda,
            }];
          });
        };

        const updateDraftQuantity = (productId, delta) => {
          setDraftItems(prev => prev.map(item => {
            if (item.produto_id === productId) {
              const newQty = item.quantidade + delta;
              if (newQty <= 0) return null;
              return { ...item, quantidade: newQty, subtotal: newQty * item.preco_unitario };
            }
            return item;
          }).filter(Boolean));
        };

        const handleSaveAsPending = () => {
          if (!selectedCustomer || draftItems.length === 0) return;
          const itemsToInsert = draftItems.map(item => ({
            id: 'cmd-' + Date.now() + '-' + Math.random().toString(36).substr(2, 4),
            cliente_id: selectedCustomer.id,
            cliente_nome: selectedCustomer.nome,
            data_evento: selectedDate,
            produto_id: item.produto_id,
            produto_nome: item.produto_nome,
            quantidade: item.quantidade,
            preco_unitario: item.preco_unitario,
            preco_custo: item.preco_custo,
            subtotal: item.subtotal,
            status: 'pendente',
            created_at: new Date().toISOString(),
          }));
          onAddComandaItems(itemsToInsert);
          setDraftItems([]);
          setSuccessFeedback('Consumo de ' + selectedCustomer.nome + ' lançado na comanda!');
          setTimeout(() => setSuccessFeedback(null), 3000);
        };

        const handleImmediatePayment = (method) => {
          if (!selectedCustomer) return;
          if (draftItems.length === 0) {
            if (accumulatedDebt > 0) {
              setSettleModal({
                clienteId: selectedCustomer.id,
                method,
                amount: accumulatedDebt,
                title: 'Quitar Saldo Pendente',
                message: 'Quitar todo o saldo pendente de ' + selectedCustomer.nome + ' (' + formatCurrency(accumulatedDebt) + ') via ' + method.toUpperCase() + '?',
              });
            }
            return;
          }
          const itemsToInsert = draftItems.map(item => ({
            id: 'cmd-' + Date.now() + '-' + Math.random().toString(36).substr(2, 4),
            cliente_id: selectedCustomer.id,
            cliente_nome: selectedCustomer.nome,
            data_evento: selectedDate,
            produto_id: item.produto_id,
            produto_nome: item.produto_nome,
            quantidade: item.quantidade,
            preco_unitario: item.preco_unitario,
            preco_custo: item.preco_custo,
            subtotal: item.subtotal,
            status: 'pago',
            forma_pagamento: method,
            created_at: new Date().toISOString(),
          }));
          onAddComandaItems(itemsToInsert);
          setDraftItems([]);
          setSuccessFeedback('Venda de ' + selectedCustomer.nome + ' paga via ' + method.toUpperCase() + '!');
          setTimeout(() => setSuccessFeedback(null), 3000);
        };

        const handleSendZap = () => {
          if (!selectedCustomer) return;
          let text = '*Tablell - Extrato de Consumo*\nOlá ' + selectedCustomer.nome + '! Segue o extrato da sua comanda:\n\n';
          if (draftItems.length > 0) {
            text += '*Consumo no Evento (' + selectedDate + '):*\n';
            draftItems.forEach(i => text += '- ' + i.quantidade + 'x ' + i.produto_nome + ': ' + formatCurrency(i.subtotal) + '\n');
            text += '*Subtotal do evento: ' + formatCurrency(currentEventTotal) + '*\n\n';
          }
          if (pendingByDate.length > 0) {
            text += '*Pendências Anteriores:*\n';
            pendingByDate.forEach(p => text += '📅 ' + p.data.split('-').reverse().join('/') + ': ' + formatCurrency(p.total) + '\n');
            text += '\n';
          }
          const totalCobrar = currentEventTotal + accumulatedDebt;
          text += '*TOTAL A ACERTAR: ' + formatCurrency(totalCobrar) + '*\n\nValeu pela preferência! ⚽🍻';
          const cleanPhone = (selectedCustomer.telefone || '').replace(/\D/g, '');
          const phoneParam = cleanPhone ? 'phone=55' + cleanPhone + '&' : '';
          window.open('https://api.whatsapp.com/send?' + phoneParam + 'text=' + encodeURIComponent(text), '_blank');
        };

        return (
          <div className="max-w-[1600px] mx-auto px-4 sm:px-6 py-6">
            {successFeedback && (
              <div className="mb-4 p-3 bg-emerald-950/80 border border-emerald-800 text-emerald-300 rounded-xl text-xs font-semibold flex items-center gap-2">
                <Icon.CheckCircle className="w-4 h-4 text-emerald-400 shrink-0" />
                <span>{successFeedback}</span>
              </div>
            )}

            <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
              {/* Left Column */}
              <div className="lg:col-span-7 space-y-6">
                <div className="space-y-2">
                  <div className="flex items-center justify-between">
                    <span className="text-xs font-bold text-slate-300 uppercase tracking-wide">1. Data do Evento</span>
                    <span className="text-[11px] text-slate-500">Toque para abrir a conta</span>
                  </div>
                  <input
                    type="date"
                    value={selectedDate}
                    onChange={e => setSelectedDate(e.target.value)}
                    className="w-full sm:w-64 px-3.5 py-2.5 bg-[#131924] border border-[#1e2638] rounded-xl text-sm text-slate-100 font-semibold focus:outline-none focus:border-violet-500 shadow-sm"
                  />
                </div>

                <div className="space-y-2">
                  <span className="text-xs font-bold text-slate-300 uppercase tracking-wide">2. Selecione o Amigo</span>
                  <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
                    {customers.map(c => {
                      const debt = customerDebts[c.id] || 0;
                      const isSelected = selectedCustomerId === c.id;
                      return (
                        <button
                          key={c.id}
                          onClick={() => setSelectedCustomerId(c.id)}
                          className={"p-3.5 rounded-xl border text-left transition-all flex items-center gap-3 cursor-pointer " + (isSelected ? 'bg-[#1a2232] border-violet-500 ring-2 ring-violet-500/40 text-white' : 'bg-[#131924] border-[#1e2638] hover:border-slate-700 text-slate-200')}
                        >
                          <span className="text-2xl shrink-0">{c.avatar || '😎'}</span>
                          <div className="truncate">
                            <p className="text-sm font-bold text-slate-100 truncate">{c.nome}</p>
                            <p className={"text-xs font-semibold mt-0.5 " + (debt > 0 ? 'text-rose-400' : 'text-emerald-400')}>
                              {debt > 0 ? 'Devendo ' + formatCurrency(debt) : 'Quitado'}
                            </p>
                          </div>
                        </button>
                      );
                    })}
                  </div>
                </div>

                <div className="space-y-2">
                  <span className="text-xs font-bold text-slate-300 uppercase tracking-wide">3. Marcar Consumo</span>
                  <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
                    {products.map(prod => {
                      const draftItem = draftItems.find(i => i.produto_id === prod.id);
                      return (
                        <button
                          key={prod.id}
                          onClick={() => handleAddProductToDraft(prod)}
                          className="p-4 rounded-xl border border-[#1e2638] bg-[#131924] hover:border-violet-500/70 hover:bg-[#161e2c] transition-all text-left flex flex-col justify-between h-24 relative overflow-hidden active:scale-[0.98] cursor-pointer"
                        >
                          {draftItem && (
                            <span className="absolute top-2 right-2 w-5 h-5 rounded-full bg-violet-600 text-white font-bold text-[11px] flex items-center justify-center font-mono">
                              {draftItem.quantidade}
                            </span>
                          )}
                          <span className="text-sm font-semibold text-slate-200 line-clamp-1">{prod.nome}</span>
                          <span className="text-base font-bold text-violet-400 font-mono">{formatCurrency(prod.preco_venda)}</span>
                        </button>
                      );
                    })}
                  </div>
                </div>
              </div>

              {/* Right Column */}
              <div className="lg:col-span-5 bg-[#131924] border border-[#1e2638] rounded-xl p-5 shadow-sm space-y-4 sticky top-20">
                <div className="flex items-start justify-between pb-3 border-b border-[#1e2638]">
                  <div>
                    <h3 className="text-base font-bold text-white">
                      {selectedCustomer ? selectedCustomer.avatar + ' ' + selectedCustomer.nome : 'Selecione um amigo'}
                    </h3>
                    <p className="text-xs mt-0.5">
                      <span className="text-slate-400">Saldo Acumulado: </span>
                      <span className={"font-bold font-mono " + (accumulatedDebt > 0 ? 'text-rose-400' : 'text-emerald-400')}>
                        {formatCurrency(accumulatedDebt)}
                      </span>
                    </p>
                  </div>
                  <div className="flex items-center gap-1.5">
                    <button
                      onClick={handleSendZap}
                      className="flex items-center gap-1 px-2.5 py-1 text-xs font-semibold text-emerald-300 bg-emerald-950/80 hover:bg-emerald-900 border border-emerald-800/80 rounded-lg transition-colors cursor-pointer"
                      title="Cobrar no WhatsApp"
                    >
                      <Icon.MessageSquare className="w-3.5 h-3.5" />
                      <span>Zap</span>
                    </button>
                    <button
                      onClick={() => setDraftItems([])}
                      className="px-2.5 py-1 text-xs font-semibold text-slate-400 bg-slate-800 hover:bg-slate-700 hover:text-slate-200 rounded-lg transition-colors cursor-pointer"
                    >
                      Limpar
                    </button>
                  </div>
                </div>

                {/* Marcando no Evento */}
                <div className="space-y-2">
                  <span className="text-xs font-bold text-violet-400 uppercase tracking-wider block">
                    Marcando no Evento ({selectedDate.split('-').reverse().join('/')}):
                  </span>
                  {draftItems.length > 0 ? (
                    <div className="divide-y divide-[#1e2638] max-h-44 overflow-y-auto pr-1">
                      {draftItems.map(item => (
                        <div key={item.produto_id} className="py-2 flex items-center justify-between text-xs">
                          <div className="truncate flex-1">
                            <p className="font-semibold text-slate-200 truncate">{item.produto_nome}</p>
                            <p className="text-[11px] text-slate-500 font-mono">{formatCurrency(item.preco_unitario)} cada</p>
                          </div>
                          <div className="flex items-center gap-1.5 shrink-0 px-2">
                            <button onClick={() => updateDraftQuantity(item.produto_id, -1)} className="w-5 h-5 rounded bg-slate-800 hover:bg-slate-700 flex items-center justify-center text-slate-300 font-bold cursor-pointer">-</button>
                            <span className="w-5 text-center font-bold text-white font-mono">{item.quantidade}</span>
                            <button onClick={() => updateDraftQuantity(item.produto_id, 1)} className="w-5 h-5 rounded bg-slate-800 hover:bg-slate-700 flex items-center justify-center text-slate-300 font-bold cursor-pointer">+</button>
                          </div>
                          <span className="font-bold text-white font-mono w-16 text-right">{formatCurrency(item.subtotal)}</span>
                        </div>
                      ))}
                    </div>
                  ) : (
                    <p className="text-xs text-slate-500 italic py-1">
                      {selectedCustomer ? 'Nenhum produto marcado. Toque nos itens ao lado.' : 'Selecione um amigo.'}
                    </p>
                  )}
                </div>

                {/* Extrato por Datas Pendentes */}
                <div className="space-y-2 pt-2 border-t border-[#1e2638]">
                  <span className="text-xs font-bold text-slate-400 uppercase tracking-wider block">Extrato por Datas Pendentes:</span>
                  {pendingByDate.length > 0 ? (
                    <div className="space-y-2 max-h-36 overflow-y-auto pr-1">
                      {pendingByDate.map(p => (
                        <div key={p.data} className="p-2.5 bg-[#0e121a] border border-[#1e2638] rounded-lg flex items-center justify-between text-xs">
                          <div>
                            <p className="font-semibold text-slate-300">{p.data.split('-').reverse().join('/')}</p>
                            <p className="text-[11px] text-slate-500">{p.items.map(i => i.quantidade + 'x ' + i.produto_nome).join(', ')}</p>
                          </div>
                          <div className="flex items-center gap-2">
                            <span className="font-bold font-mono text-rose-400">{formatCurrency(p.total)}</span>
                            <button
                              onClick={() => setSettleModal({
                                clienteId: selectedCustomer.id,
                                dataEvento: p.data,
                                method: 'pix',
                                amount: p.total,
                                title: 'Quitar Consumo do Evento',
                                message: 'Quitar o fiado de ' + p.data.split('-').reverse().join('/') + ' (' + formatCurrency(p.total) + ') de ' + selectedCustomer.nome + '?',
                              })}
                              className="px-2 py-0.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded text-[11px] font-semibold cursor-pointer"
                            >
                              Quitar
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>
                  ) : (
                    <p className="text-xs text-slate-500 italic py-1">
                      {selectedCustomer ? 'Nenhuma pendência anterior registrada para este amigo.' : 'Selecione um amigo.'}
                    </p>
                  )}
                </div>

                {/* Total & Action Buttons */}
                <div className="pt-3 border-t border-[#1e2638] space-y-3">
                  <div className="flex items-center justify-between">
                    <span className="text-sm font-semibold text-slate-300">Valor do Evento Atual:</span>
                    <span className="text-xl font-bold font-mono text-violet-400">{formatCurrency(currentEventTotal)}</span>
                  </div>

                  <button
                    onClick={handleSaveAsPending}
                    disabled={draftItems.length === 0}
                    className={"w-full py-3 rounded-xl font-bold text-sm text-white flex items-center justify-center gap-2 shadow-lg transition-all " + (draftItems.length > 0 ? 'bg-violet-600 hover:bg-violet-500 active:bg-violet-700 shadow-violet-950/60 cursor-pointer' : 'bg-violet-950/40 text-slate-500 border border-violet-900/30 cursor-not-allowed')}
                  >
                    <Icon.Plus className="w-4 h-4" />
                    <span>Lançar Consumo na Data Selecionada</span>
                  </button>

                  <div className="grid grid-cols-3 gap-2">
                    <button type="button" onClick={() => handleImmediatePayment('pix')} className="py-2.5 rounded-lg font-bold text-xs text-white bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 transition-all text-center cursor-pointer">
                      PIX
                    </button>
                    <button type="button" onClick={() => handleImmediatePayment('dinheiro')} className="py-2.5 rounded-lg font-bold text-xs text-white bg-blue-600 hover:bg-blue-500 active:bg-blue-700 transition-all text-center cursor-pointer">
                      Dinheiro
                    </button>
                    <button type="button" onClick={() => handleImmediatePayment('cartao')} className="py-2.5 rounded-lg font-bold text-xs text-white bg-purple-600 hover:bg-purple-500 active:bg-purple-700 transition-all text-center cursor-pointer">
                      Cartão
                    </button>
                  </div>
                </div>
              </div>
            </div>

            <ConfirmModal
              isOpen={Boolean(settleModal)}
              title={settleModal?.title || 'Confirmar'}
              message={settleModal?.message || ''}
              confirmLabel="Sim, Confirmar"
              cancelLabel="Cancelar"
              variant="primary"
              onConfirm={() => {
                if (settleModal) {
                  onSettleComanda(settleModal.clienteId, settleModal.dataEvento, settleModal.method);
                  setSuccessFeedback('Recebimento registrado com sucesso!');
                  setSettleModal(null);
                  setTimeout(() => setSuccessFeedback(null), 3000);
                }
              }}
              onCancel={() => setSettleModal(null)}
            />
          </div>
        );
      }

      // --- VIEW: BALANÇO & LUCRO REAL ---
      function LucroFinanceiroView({ products, comandaItems, expenses, payments }) {
        const metrics = useMemo(() => {
          let totalVendasBrutas = 0;
          let totalCustoProdutosVendidos = 0;
          let totalRecebido = 0;
          let totalPendente = 0;

          comandaItems.forEach(i => {
            totalVendasBrutas += i.subtotal;
            totalCustoProdutosVendidos += (i.preco_custo || 0) * i.quantidade;
            if (i.status === 'pago') totalRecebido += i.subtotal;
            else totalPendente += i.subtotal;
          });

          const totalDespesasCompras = expenses.reduce((acc, e) => acc + (Number(e.valor) || 0), 0);
          const lucroRealContabil = totalVendasBrutas - totalDespesasCompras;
          const margemReal = totalVendasBrutas > 0 ? (lucroRealContabil / totalVendasBrutas) * 100 : 0;
          const lucroOperacionalBruto = totalVendasBrutas - totalCustoProdutosVendidos;

          return {
            totalVendasBrutas,
            totalDespesasCompras,
            lucroRealContabil,
            margemReal,
            lucroOperacionalBruto,
            totalRecebido,
            totalPendente,
          };
        }, [comandaItems, expenses]);

        return (
          <div className="max-w-[1600px] mx-auto px-4 sm:px-6 py-6 space-y-6">
            <div>
              <h1 className="text-xl sm:text-2xl font-bold text-white tracking-tight flex items-center gap-2">
                <Icon.TrendingUp className="w-5 h-5 text-violet-400" />
                Balanço Financeiro & Lucro Líquido Real
              </h1>
              <p className="text-xs text-slate-400 mt-0.5">
                Cálculo executivo automático de receita total, compras de insumos, margem real e fiados a receber
              </p>
            </div>

            {/* KPI Cards Grid */}
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
              <div className="bg-[#131924] border border-[#1e2638] rounded-xl p-5 shadow-sm">
                <span className="text-[11px] font-bold text-slate-400 uppercase tracking-wide block">Faturamento Bruto Total</span>
                <p className="text-2xl font-bold font-mono text-white mt-1">{formatCurrency(metrics.totalVendasBrutas)}</p>
                <span className="text-[10px] text-slate-500 font-medium mt-1 block">Total comercializado em comandas</span>
              </div>

              <div className="bg-[#131924] border border-[#1e2638] rounded-xl p-5 shadow-sm">
                <span className="text-[11px] font-bold text-slate-400 uppercase tracking-wide block">Total em Compras & Gastos</span>
                <p className="text-2xl font-bold font-mono text-rose-400 mt-1">{formatCurrency(metrics.totalDespesasCompras)}</p>
                <span className="text-[10px] text-slate-500 font-medium mt-1 block">Bebidas, carnes, carvão e operação</span>
              </div>

              <div className="bg-[#131924] border border-emerald-900/40 rounded-xl p-5 shadow-sm">
                <span className="text-[11px] font-bold text-emerald-400 uppercase tracking-wide block">Lucro Líquido Real</span>
                <p className={"text-2xl font-bold font-mono mt-1 " + (metrics.lucroRealContabil >= 0 ? 'text-emerald-400' : 'text-rose-400')}>
                  {formatCurrency(metrics.lucroRealContabil)}
                </p>
                <span className="text-[10px] text-emerald-500/80 font-medium mt-1 block">
                  Margem Líquida: {metrics.margemReal.toFixed(1)}%
                </span>
              </div>

              <div className="bg-[#131924] border border-rose-900/40 rounded-xl p-5 shadow-sm">
                <span className="text-[11px] font-bold text-rose-400 uppercase tracking-wide block">Total a Receber (Fiados)</span>
                <p className="text-2xl font-bold font-mono text-rose-400 mt-1">{formatCurrency(metrics.totalPendente)}</p>
                <span className="text-[10px] text-slate-500 font-medium mt-1 block">Já Recebido em Caixa: {formatCurrency(metrics.totalRecebido)}</span>
              </div>
            </div>

            {/* Margins Table */}
            <div className="bg-[#131924] border border-[#1e2638] rounded-xl p-5 shadow-sm space-y-4">
              <h3 className="text-sm font-bold text-white flex items-center gap-2">
                <Icon.Package className="w-4 h-4 text-violet-400" />
                Margem Unitária por Produto Cadastrado
              </h3>

              <div className="overflow-x-auto">
                <table className="w-full text-xs text-left">
                  <thead className="bg-[#0e121a] text-slate-400 uppercase font-semibold text-[10px] border-b border-[#1e2638]">
                    <tr>
                      <th className="py-2.5 px-3">Produto</th>
                      <th className="py-2.5 px-3">Categoria</th>
                      <th className="py-2.5 px-3 text-right">Preço de Custo</th>
                      <th className="py-2.5 px-3 text-right">Preço de Venda</th>
                      <th className="py-2.5 px-3 text-right">Lucro Bruto Unitário</th>
                      <th className="py-2.5 px-3 text-right">Margem Bruta %</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-[#1e2638]">
                    {products.map(p => {
                      const lucroUnit = p.preco_venda - p.preco_custo;
                      const margemBruta = p.preco_venda > 0 ? (lucroUnit / p.preco_venda) * 100 : 0;
                      return (
                        <tr key={p.id} className="hover:bg-[#161e2c] transition-colors">
                          <td className="py-2.5 px-3 font-semibold text-white">{p.nome}</td>
                          <td className="py-2.5 px-3 text-slate-400">
                            <span className="px-2 py-0.5 rounded bg-violet-950/60 border border-violet-800/40 text-[10px] text-violet-300 font-semibold">
                              {p.categoria || 'Geral'}
                            </span>
                          </td>
                          <td className="py-2.5 px-3 text-right font-mono text-slate-300">{formatCurrency(p.preco_custo)}</td>
                          <td className="py-2.5 px-3 text-right font-mono text-violet-300 font-bold">{formatCurrency(p.preco_venda)}</td>
                          <td className="py-2.5 px-3 text-right font-mono text-emerald-400 font-bold">+{formatCurrency(lucroUnit)}</td>
                          <td className="py-2.5 px-3 text-right font-mono text-emerald-400 font-bold">{margemBruta.toFixed(1)}%</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        );
      }

      // --- VIEW: COMPRAS & GASTOS ---

      // --- VIEW: FIADOS POR DATA ---
      function FiadosPorDataView({ comandaItems, customers, onSettleComanda }) {
        const [selectedFilter, setSelectedFilter] = useState('all');
        const [settlingCustomer, setSettlingCustomer] = useState(null);

        const distinctDates = useMemo(() => {
          const set = new Set();
          comandaItems.forEach(i => {
            if (i.status === 'pendente') set.add(i.data_evento);
          });
          return Array.from(set).sort((a, b) => b.localeCompare(a));
        }, [comandaItems]);

        const pendingByCustomer = useMemo(() => {
          const map = {};
          comandaItems.forEach(item => {
            if (item.status === 'pendente') {
              if (selectedFilter !== 'all' && item.data_evento !== selectedFilter) return;
              if (!map[item.cliente_id]) {
                const cust = customers.find(c => c.id === item.cliente_id);
                map[item.cliente_id] = {
                  cliente_id: item.cliente_id,
                  cliente_nome: item.cliente_nome,
                  avatar: cust?.avatar || '😎',
                  telefone: cust?.telefone,
                  datas: {},
                  totalGeral: 0,
                };
              }
              if (!map[item.cliente_id].datas[item.data_evento]) {
                map[item.cliente_id].datas[item.data_evento] = { items: [], total: 0 };
              }
              map[item.cliente_id].datas[item.data_evento].items.push(item);
              map[item.cliente_id].datas[item.data_evento].total += item.subtotal;
              map[item.cliente_id].totalGeral += item.subtotal;
            }
          });
          return Object.values(map).sort((a, b) => b.totalGeral - a.totalGeral);
        }, [comandaItems, customers, selectedFilter]);

        const totalAReceber = useMemo(() => pendingByCustomer.reduce((acc, c) => acc + c.totalGeral, 0), [pendingByCustomer]);

        const handleSendZap = (customerName, phone, total, dateDetails) => {
          let text = '*Tablell - Lembrete de Pagamento*\nOlá ' + customerName + '! Segue o extrato pendente:\n\n' + dateDetails + '\n*VALOR TOTAL PENDENTE: ' + formatCurrency(total) + '*\n\nPode fazer o Pix quando puder! Valeu! ⚽🍻';
          const cleanPhone = (phone || '').replace(/\D/g, '');
          const phoneParam = cleanPhone ? 'phone=55' + cleanPhone + '&' : '';
          window.open('https://api.whatsapp.com/send?' + phoneParam + 'text=' + encodeURIComponent(text), '_blank');
        };

        return (
          <div className="max-w-[1600px] mx-auto px-4 sm:px-6 py-6 space-y-6">
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
              <div>
                <h1 className="text-xl sm:text-2xl font-bold text-white tracking-tight flex items-center gap-2">
                  <Icon.FileText className="w-5 h-5 text-violet-400" />
                  Relatório de Pendências por Evento
                </h1>
                <p className="text-xs text-slate-400 mt-0.5">Filtre por data para consultar o que cada amigo consumiu</p>
              </div>

              <div className="flex items-center gap-4">
                <select
                  value={selectedFilter}
                  onChange={e => setSelectedFilter(e.target.value)}
                  className="px-3.5 py-2 bg-[#131924] border border-[#1e2638] rounded-xl text-xs font-semibold text-slate-200 focus:outline-none focus:border-violet-500 cursor-pointer"
                >
                  <option value="all">Todas as Datas (Acumulado)</option>
                  {distinctDates.map(d => (
                    <option key={d} value={d}>{d.split('-').reverse().join('/')}</option>
                  ))}
                </select>

                <div className="bg-[#131924] border border-rose-900/40 rounded-xl px-4 py-2 text-right">
                  <span className="text-[10px] font-bold text-rose-400 uppercase tracking-wide block">Total a Receber</span>
                  <span className="text-lg font-bold font-mono text-rose-400">{formatCurrency(totalAReceber)}</span>
                </div>
              </div>
            </div>

            {pendingByCustomer.length > 0 ? (
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                {pendingByCustomer.map(cust => {
                  const dateDetails = Object.entries(cust.datas)
                    .map(([date, d]) => '📅 ' + date.split('-').reverse().join('/') + ': ' + d.items.map(i => i.quantidade + 'x ' + i.produto_nome).join(', ') + ' (' + formatCurrency(d.total) + ')')
                    .join('\n');

                  return (
                    <div key={cust.cliente_id} className="bg-[#131924] border border-[#1e2638] rounded-xl p-5 shadow-sm space-y-4 flex flex-col justify-between">
                      <div>
                        <div className="flex items-center justify-between pb-2 border-b border-[#1e2638]">
                          <div className="flex items-center gap-2.5">
                            <span className="text-2xl">{cust.avatar}</span>
                            <div>
                              <h4 className="text-sm font-bold text-white">{cust.cliente_nome}</h4>
                              {cust.telefone && <p className="text-[11px] font-mono text-slate-400">{cust.telefone}</p>}
                            </div>
                          </div>
                          <span className="text-base font-bold font-mono text-rose-400">{formatCurrency(cust.totalGeral)}</span>
                        </div>

                        <div className="space-y-2 pt-2">
                          {Object.entries(cust.datas).map(([dataEvento, dataObj]) => (
                            <div key={dataEvento} className="bg-[#0e121a] p-2.5 rounded-lg border border-[#1e2638] text-xs">
                              <div className="flex justify-between font-semibold text-slate-300 mb-1">
                                <span>{dataEvento.split('-').reverse().join('/')}</span>
                                <span className="font-mono text-rose-400">{formatCurrency(dataObj.total)}</span>
                              </div>
                              <p className="text-[11px] text-slate-400">{dataObj.items.map(i => i.quantidade + 'x ' + i.produto_nome).join(', ')}</p>
                            </div>
                          ))}
                        </div>
                      </div>

                      <div className="pt-3 border-t border-[#1e2638] flex items-center justify-between gap-2">
                        <button
                          onClick={() => handleSendZap(cust.cliente_nome, cust.telefone, cust.totalGeral, dateDetails)}
                          className="flex-1 flex items-center justify-center gap-1.5 px-3 py-2 text-xs font-semibold text-emerald-300 bg-emerald-950/80 hover:bg-emerald-900 border border-emerald-800/80 rounded-xl transition-colors cursor-pointer"
                        >
                          <Icon.MessageSquare className="w-3.5 h-3.5" />
                          <span>Cobrar no Zap</span>
                        </button>
                        <button
                          onClick={() => setSettlingCustomer({ id: cust.cliente_id, name: cust.cliente_nome, amount: cust.totalGeral })}
                          className="px-4 py-2 text-xs font-bold text-white bg-emerald-600 hover:bg-emerald-500 rounded-xl transition-colors cursor-pointer"
                        >
                          Quitar Tudo
                        </button>
                      </div>
                    </div>
                  );
                })}
              </div>
            ) : (
              <div className="py-24 text-center">
                <p className="text-sm font-semibold text-slate-500">Nenhuma pendência encontrada para este filtro! 🎉</p>
              </div>
            )}

            <ConfirmModal
              isOpen={Boolean(settlingCustomer)}
              title="Quitar Pendência"
              message={settlingCustomer ? 'Confirmar recebimento total de ' + settlingCustomer.name + ' (' + formatCurrency(settlingCustomer.amount) + ')?' : ''}
              confirmLabel="Confirmar Quitação"
              variant="primary"
              onConfirm={() => {
                if (settlingCustomer) {
                  onSettleComanda(settlingCustomer.id, selectedFilter === 'all' ? undefined : selectedFilter, 'pix');
                  setSettlingCustomer(null);
                }
              }}
              onCancel={() => setSettlingCustomer(null)}
            />
          </div>
        );
      }

          const catFinal = categoria.trim() || 'Geral';
          if (!nome.trim() || vendaNum <= 0) return;

          if (editingId) {
            const existing = products.find(p => p.id === editingId);
            if (existing) {
              onSaveProduct({ ...existing, nome: nome.trim(), preco_custo: custoNum, preco_venda: vendaNum, categoria: catFinal });
            }
            setEditingId(null);
          } else {
            onSaveProduct({
              id: 'prod-' + Date.now(),
              nome: nome.trim(),
              preco_custo: custoNum,
              preco_venda: vendaNum,
              categoria: catFinal,
            });
          }
          setNome('');
          setCusto('');
          setVenda('');
          setCategoria('Geral');

              <select
                value={categoria}
                onChange={e => setCategoria(e.target.value)}
                className="w-full sm:w-36 px-3 py-2.5 bg-[#131924] border border-[#1e2638] rounded-xl text-sm text-slate-200 focus:outline-none focus:border-violet-500 cursor-pointer"
              >
                {CATEGORIA_OPTIONS.map(cat => <option key={cat} value={cat} className="bg-[#131924]">{cat}</option>)}

              <input

              <input

              <button

              {editingId && (

      // --- VIEW: SUPABASE & BACKUP ---
      function SupabaseConfigView({ config, onSaveConfig, onDataReset }) {
        const [url, setUrl] = useState(config.url || DEFAULT_SUPABASE_CONFIG.url);
        const [anonKey, setAnonKey] = useState(config.anon_key || DEFAULT_SUPABASE_CONFIG.anon_key);
        const [isTesting, setIsTesting] = useState(false);
        const [testResult, setTestResult] = useState(null);
        const [isSyncing, setIsSyncing] = useState(false);
        const [syncResult, setSyncResult] = useState(null);
        const [copiedSql, setCopiedSql] = useState(false);
        const [showResetModal, setShowResetModal] = useState(false);

        const sqlSchema = getSupabaseSQLSchema();

        const handleTest = async () => {
          setIsTesting(true);
          setTestResult(null);
          const res = await testConnection(url.trim(), anonKey.trim());
          setIsTesting(false);
          setTestResult(res);
          if (res.success) {
            onSaveConfig({ ...config, url: url.trim(), anon_key: anonKey.trim(), is_connected: true });
          }
        };

        const handleSync = async () => {
          setIsSyncing(true);
          setSyncResult(null);
          const res = await pushLocalDataToSupabase();
          setIsSyncing(false);
          setSyncResult(res);
        };

        const handleCopySql = () => {
          navigator.clipboard.writeText(sqlSchema);
          setCopiedSql(true);
          setTimeout(() => setCopiedSql(false), 2000);
        };

        const handleExportBackup = () => {
          const json = storageService.exportBackupJSON();
          const blob = new Blob([json], { type: 'application/json' });
          const blobUrl = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = blobUrl;
          a.download = 'backup_tablell_' + todayStr + '.json';
          a.click();
        };

        const handleImportFile = (e) => {
          const file = e.target.files?.[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = ev => {
            const ok = storageService.importBackupJSON(ev.target.result);
            if (ok) {
              setTestResult({ success: true, message: 'Backup restaurado com sucesso!' });
              onDataReset();
            } else {
              setTestResult({ success: false, message: 'Arquivo de backup inválido.' });
            }
          };
          reader.readAsText(file);
        };

        return (
          <div className="max-w-[1600px] mx-auto px-4 sm:px-6 py-6 space-y-6">
            <div>
              <h1 className="text-xl sm:text-2xl font-bold text-white tracking-tight flex items-center gap-2">
                <Icon.Database className="w-5 h-5 text-violet-400" />
                Integração Nativa com Supabase
              </h1>
              <p className="text-xs text-slate-400 mt-0.5">Banco de dados em nuvem com sincronização ao vivo e backup local</p>
            </div>

            <div className="bg-[#131924] border border-[#1e2638] rounded-xl p-6 shadow-sm space-y-4">
              <div className="flex items-center justify-between pb-3 border-b border-[#1e2638]">
                <div>
                  <h3 className="text-sm font-bold text-white">Credenciais Salvas</h3>
                  <p className="text-xs text-slate-400 font-mono mt-0.5">{url}</p>
                </div>
                <span className="text-xs text-emerald-400 font-mono font-semibold">Configurado no Código</span>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                  <label className="block text-xs font-semibold text-slate-300 mb-1">Project URL</label>
                  <input
                    type="text"
                    value={url}
                    onChange={e => setUrl(e.target.value)}
                    className="w-full px-3.5 py-2 bg-[#0c1017] border border-[#1e2638] rounded-xl text-xs text-slate-100 font-mono focus:outline-none focus:border-violet-500"
                  />
                </div>
                <div>
                  <label className="block text-xs font-semibold text-slate-300 mb-1">Publish Key (Anon Key)</label>
                  <input
                    type="password"
                    value={anonKey}
                    onChange={e => setAnonKey(e.target.value)}
                    className="w-full px-3.5 py-2 bg-[#0c1017] border border-[#1e2638] rounded-xl text-xs text-slate-100 font-mono focus:outline-none focus:border-violet-500"
                  />
                </div>
              </div>

              {testResult && (
                <div className={"p-3.5 rounded-xl text-xs flex items-start gap-2.5 border " + (testResult.success ? 'bg-emerald-950/80 border-emerald-800 text-emerald-300' : 'bg-rose-950/80 border-rose-800 text-rose-300')}>
                  {testResult.success ? <Icon.CheckCircle className="w-4 h-4 text-emerald-400 shrink-0 mt-0.5" /> : <Icon.AlertCircle className="w-4 h-4 text-rose-400 shrink-0 mt-0.5" />}
                  <div className="flex-1">
                    <p className="font-bold">{testResult.success ? 'Conexão Verificada!' : 'Falha na Conexão'}</p>
                    <p className="text-[11px] mt-0.5">{testResult.message}</p>
                  </div>
                </div>
              )}

              {syncResult && (
                <div className={"p-3.5 rounded-xl text-xs flex items-start gap-2.5 border " + (syncResult.success ? 'bg-emerald-950/80 border-emerald-800 text-emerald-300' : 'bg-rose-950/80 border-rose-800 text-rose-300')}>
                  {syncResult.success ? <Icon.CheckCircle className="w-4 h-4 text-emerald-400 shrink-0 mt-0.5" /> : <Icon.AlertCircle className="w-4 h-4 text-rose-400 shrink-0 mt-0.5" />}
                  <div className="flex-1">
                    <p className="font-bold">{syncResult.success ? 'Sincronização Concluída' : 'Erro de Sincronização'}</p>
                    <p className="text-[11px] mt-0.5">{syncResult.message}</p>
                  </div>
                </div>
              )}

              <div className="flex flex-wrap items-center justify-between gap-3 pt-3 border-t border-[#1e2638]">
                <div className="flex items-center gap-2">
                  <button
                    onClick={handleTest}
                    disabled={isTesting}
                    className="px-4 py-2 text-xs font-bold text-slate-200 bg-slate-800 hover:bg-slate-700 rounded-xl transition-colors border border-slate-700 flex items-center gap-1.5 cursor-pointer"
                  >
                    <Icon.RefreshCw className={"w-3.5 h-3.5 " + (isTesting ? 'animate-spin text-violet-400' : '')} />
                    <span>{isTesting ? 'Testando Conexão...' : 'Testar Conexão Supabase'}</span>
                  </button>
                  <button
                    onClick={handleSync}
                    disabled={isSyncing}
                    className="px-5 py-2 text-xs font-bold text-white bg-violet-600 hover:bg-violet-500 rounded-xl transition-colors flex items-center gap-1.5 shadow-md shadow-violet-950/50 cursor-pointer"
                  >
                    <Icon.UploadCloud className={"w-3.5 h-3.5 " + (isSyncing ? 'animate-pulse' : '')} />
                    <span>{isSyncing ? 'Sincronizando...' : 'Sincronizar Dados Agora'}</span>
                  </button>
                </div>
              </div>
            </div>

            {/* SQL Box */}
            <div className="bg-[#131924] border border-[#1e2638] rounded-xl p-6 shadow-sm space-y-3">
              <div className="flex items-center justify-between">
                <div>
                  <h3 className="text-sm font-bold text-white flex items-center gap-2">
                    <Icon.Code className="w-4 h-4 text-violet-400" />
                    Script SQL para Criação e Atualização de Tabelas
                  </h3>
                  <p className="text-xs text-slate-400 mt-0.5">Execute no SQL Editor do seu Supabase para criar as tabelas</p>
                </div>
                <button
                  onClick={handleCopySql}
                  className="flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold text-slate-200 bg-slate-800 hover:bg-slate-700 rounded-lg transition-colors border border-slate-700 cursor-pointer"
                >
                  {copiedSql ? <Icon.Check className="w-3.5 h-3.5 text-emerald-400" /> : <Icon.Copy className="w-3.5 h-3.5" />}
                  <span>{copiedSql ? 'Copiado!' : 'Copiar Script SQL'}</span>
                </button>
              </div>

              <pre className="p-4 bg-[#0c1017] border border-[#1e2638] rounded-xl font-mono text-[11px] text-slate-300 overflow-x-auto max-h-56 leading-relaxed">
                {sqlSchema}
              </pre>
            </div>

            {/* Backup Box */}
            <div className="bg-[#131924] border border-[#1e2638] rounded-xl p-6 shadow-sm space-y-3">
              <h3 className="text-sm font-bold text-white flex items-center gap-2">
                <Icon.ShieldCheck className="w-4 h-4 text-blue-400" />
                Backup Local & Restauração
              </h3>
              <p className="text-xs text-slate-400">Exporte todos os dados em arquivo JSON para guardar no seu computador</p>

              <div className="flex flex-wrap items-center gap-3 pt-2">
                <button
                  onClick={handleExportBackup}
                  className="flex items-center gap-1.5 px-3.5 py-2 text-xs font-semibold text-slate-200 bg-slate-800 hover:bg-slate-700 rounded-xl transition-colors border border-slate-700 cursor-pointer"
                >
                  <Icon.DownloadCloud className="w-3.5 h-3.5 text-blue-400" />
                  <span>Baixar Backup JSON</span>
                </button>

                <label className="flex items-center gap-1.5 px-3.5 py-2 text-xs font-semibold text-slate-200 bg-slate-800 hover:bg-slate-700 rounded-xl transition-colors border border-slate-700 cursor-pointer">
                  <Icon.UploadCloud className="w-3.5 h-3.5 text-emerald-400" />
                  <span>Restaurar Backup JSON</span>
                  <input type="file" accept=".json" onChange={handleImportFile} className="hidden" />
                </label>

                <button
                  onClick={() => setShowResetModal(true)}
                  className="flex items-center gap-1.5 px-3.5 py-2 text-xs font-semibold text-violet-300 hover:bg-violet-950/80 rounded-xl transition-colors ml-auto border border-violet-900/60 cursor-pointer"

                  <Icon.RotateCcw className="w-3.5 h-3.5" />
                  <span>Recarregar Dados Padrão</span>
                </button>
              </div>
            </div>

            <ConfirmModal

              title="Recarregar Dados Padrão"

              variant="warning"
              onConfirm={() => {
                storageService.resetAllToDemo();
                onDataReset();
                setShowResetModal(false);
                setTestResult({ success: true, message: 'Dados padrão recarregados!' });

              onCancel={() => setShowResetModal(false)}
