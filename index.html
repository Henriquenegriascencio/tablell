          </div>
        );
      }

      // --- MAIN APP COMPONENT ---
      function App() {
        const [activeTab, setActiveTab] = useState('comandas');
        const [products, setProducts] = useState([]);
        const [customers, setCustomers] = useState([]);
        const [comandaItems, setComandaItems] = useState([]);
        const [expenses, setExpenses] = useState([]);
        const [payments, setPayments] = useState([]);
        const [config, setConfig] = useState(storageService.getConfig());
        const [isLoading, setIsLoading] = useState(true);
        const [syncNotice, setSyncNotice] = useState(null);

        const refreshLocalState = useCallback(() => {
          setProducts(storageService.getProducts());
          setCustomers(storageService.getCustomers());
          setComandaItems(storageService.getComandaItems());
          setExpenses(storageService.getExpenses());
          setPayments(storageService.getPayments());
          setConfig(storageService.getConfig());
        }, []);

        const loadRemoteData = useCallback(async () => {
          setIsLoading(true);
          const res = await pullAllFromSupabase();
          if (res.success) {
            refreshLocalState();
          } else {
            refreshLocalState();
            pushLocalDataToSupabase().catch(() => {});
          }
          setIsLoading(false);
        }, [refreshLocalState]);

        useEffect(() => {
          loadRemoteData();
          const unsubscribe = subscribeToRealtime(() => {
            refreshLocalState();
          });
          return () => {
            if (unsubscribe) unsubscribe();
          };
        }, [loadRemoteData, refreshLocalState]);

        // Handlers
        const handleSaveCustomer = async (cust) => {
          const updated = storageService.saveCustomer(cust);
          setCustomers([...updated]);
          const res = await upsertToSupabase('customers', cust);
          if (!res.success && res.error) {
            setSyncNotice(res.error);
            setTimeout(() => setSyncNotice(null), 8000);
          }
        };

        const handleDeleteCustomer = async (id) => {
          const updated = storageService.deleteCustomer(id);
          setCustomers([...updated]);
          const res = await deleteFromSupabase('customers', id);
          if (!res.success && res.error) {
            setSyncNotice(res.error);
            setTimeout(() => setSyncNotice(null), 8000);
          }
        };

        const handleSaveProduct = async (prod) => {
          const updated = storageService.saveProduct(prod);
          setProducts([...updated]);
          const res = await upsertToSupabase('products', prod);
          if (!res.success && res.error) {
            setSyncNotice(res.error);
            setTimeout(() => setSyncNotice(null), 8000);
          }
        };

        const handleDeleteProduct = async (id) => {
          const updated = storageService.deleteProduct(id);
          setProducts([...updated]);
          const res = await deleteFromSupabase('products', id);
          if (!res.success && res.error) {
            setSyncNotice(res.error);
            setTimeout(() => setSyncNotice(null), 8000);
          }
        };

        const handleAddComandaItems = async (items) => {
          const updated = storageService.addComandaItems(items);
          setComandaItems([...updated]);
          const res = await upsertToSupabase('comanda_items', items);
          if (!res.success && res.error) {
            setSyncNotice(res.error);
            setTimeout(() => setSyncNotice(null), 8000);
          }

          const newPayments = [];
          items.forEach(item => {
            if (item.status === 'pago') {
              const p = {
                id: 'pay-' + Date.now() + '-' + Math.random().toString(36).substr(2, 4),
                cliente_id: item.cliente_id,
                cliente_nome: item.cliente_nome,
                data_hora: new Date().toISOString(),
                valor: item.subtotal,
                forma_pagamento: item.forma_pagamento || 'pix',
                data_evento: item.data_evento,
                observacoes: 'Pago no evento: ' + item.quantidade + 'x ' + item.produto_nome,
              };
              newPayments.push(p);
              storageService.addPayment(p);
            }
          });

          if (newPayments.length > 0) {
            setPayments(storageService.getPayments());
            await upsertToSupabase('payments', newPayments);
          }
        };

        const handleSettleComanda = async (clienteId, dataEvento, method = 'pix') => {
          const { updated } = storageService.settleComandaItems(clienteId, dataEvento, method);
          setComandaItems([...updated]);
          setPayments(storageService.getPayments());

          const updatedPending = updated.filter(i => i.cliente_id === clienteId && i.status === 'pago');
          if (updatedPending.length > 0) {
            await upsertToSupabase('comanda_items', updatedPending);
          }
          const latestPayments = storageService.getPayments();
          if (latestPayments.length > 0) {
            await upsertToSupabase('payments', latestPayments[0]);
          }
        };

        const handleAddExpense = async (exp) => {
          const updated = storageService.addExpense(exp);
          setExpenses([...updated]);
          const res = await upsertToSupabase('expenses', exp);
          if (!res.success && res.error) {
            setSyncNotice(res.error);
            setTimeout(() => setSyncNotice(null), 8000);
          }
        };

        const handleDeleteExpense = async (id) => {
          const updated = storageService.deleteExpense(id);
          setExpenses([...updated]);
          const res = await deleteFromSupabase('expenses', id);
          if (!res.success && res.error) {
            setSyncNotice(res.error);
            setTimeout(() => setSyncNotice(null), 8000);
          }
        };

        const handleDeletePayment = async (id) => {
          const updated = storageService.deletePayment(id);
          setPayments([...updated]);
          const res = await deleteFromSupabase('payments', id);
          if (!res.success && res.error) {
            setSyncNotice(res.error);
            setTimeout(() => setSyncNotice(null), 8000);
          }
        };

        return (
          <div className="min-h-screen bg-[#090c13] text-slate-100 flex flex-col font-sans selection:bg-violet-600 selection:text-white">
            <Navbar activeTab={activeTab} onTabChange={setActiveTab} config={config} />

            {syncNotice && (
              <div className="bg-amber-950/90 border-b border-amber-800 text-amber-200 px-4 py-2 text-xs text-center font-mono flex items-center justify-center gap-3">
                <span>{syncNotice}</span>
                <button onClick={() => setSyncNotice(null)} className="px-2 py-0.5 text-[10px] font-bold text-amber-300 hover:text-white bg-amber-900/80 border border-amber-700/80 rounded cursor-pointer">
                  ✕ Fechar
                </button>
              </div>
            )}

            <main className="flex-1 pb-16">
              {activeTab === 'comandas' && (
                <ComandasView
                  products={products}
                  customers={customers}
                  comandaItems={comandaItems}
                  onAddComandaItems={handleAddComandaItems}
                  onSettleComanda={handleSettleComanda}
                />
              )}

              {activeTab === 'financeiro' && (
                <LucroFinanceiroView
                  products={products}
                  comandaItems={comandaItems}
                  expenses={expenses}
                  payments={payments}
                />
              )}

              {activeTab === 'gastos' && (
                <ComprasGastosView
                  expenses={expenses}
                  onAddExpense={handleAddExpense}
                  onDeleteExpense={handleDeleteExpense}
                />
              )}

              {activeTab === 'fiados' && (
                <FiadosPorDataView
                  comandaItems={comandaItems}
                  customers={customers}
                  onSettleComanda={handleSettleComanda}
                />
              )}

              {activeTab === 'pagamentos' && (
                <PagamentosView
                  payments={payments}
                  customers={customers}
                  onDeletePayment={handleDeletePayment}
                />
              )}

              {activeTab === 'clientes' && (
                <ClientesView
                  customers={customers}
                  onSaveCustomer={handleSaveCustomer}
                  onDeleteCustomer={handleDeleteCustomer}
                />
              )}

              {activeTab === 'produtos' && (
                <ProdutosView
                  products={products}
                  onSaveProduct={handleSaveProduct}
                  onDeleteProduct={handleDeleteProduct}
                />
              )}

              {activeTab === 'supabase' && (
                <SupabaseConfigView
                  config={config}
                  onSaveConfig={(newConfig) => {
                    storageService.saveConfig(newConfig);
                    setConfig(newConfig);
                  }}
                  onDataReset={refreshLocalState}
                />
              )}
            </main>

            <footer className="border-t border-[#1a2130] bg-[#0c1017] py-3.5 px-4 sm:px-6 text-center text-xs text-slate-500">
              <div className="max-w-[1600px] mx-auto flex flex-col sm:flex-row items-center justify-between gap-2">
                <p className="font-semibold text-slate-400">
                  Tablell &middot; Gestão de Comandas, Fiados & Balanço Financeiro
                </p>
                <div className="flex items-center gap-3 text-slate-400 font-mono text-[11px]">
                  <button
                    onClick={loadRemoteData}
                    disabled={isLoading}
                    className="flex items-center gap-1.5 text-emerald-400 hover:text-emerald-300 font-semibold cursor-pointer transition-colors"
                    title="Clique para re-sincronizar dados do Supabase"
                  >
                    <span className={"w-2 h-2 rounded-full " + (isLoading ? 'bg-amber-400 animate-ping' : 'bg-emerald-400 animate-pulse')} />
                    <span>{isLoading ? 'Carregando do Supabase...' : '● Sincronizado 100% Ao Vivo (Supabase)'}</span>
                  </button>
                  <span>&middot;</span>
                  <span className="text-slate-500">srfnlbapjlbijeqmndgq</span>
                </div>
              </div>
            </footer>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
